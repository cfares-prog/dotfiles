# =====================================================================
# 1. GENERAL SETTINGS & FIXES
# =====================================================================

# Change the default prefix from Ctrl+b to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config file easily with Prefix + r
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Enable full mouse support (click to select panes, drag to resize)
set -g mouse on

# Increase scrollback history limit (default is 2000)
set -g history-limit 50000

# Fix terminal color issues (Ensure 256color / 24-bit TrueColor works)
set -as terminal-features ",xterm-256color:RGB"

# Start window and pane numbering at 1 instead of 0 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Disable escape-time delay (fixes sluggishness when using Vim/Neovim)
set -s escape-time 0


# =====================================================================
# 2. NAVIGATION & SPLITTING
# =====================================================================

# Use | and - to split windows horizontally and vertically (intuitive keys)
# Opens new panes in the SAME directory you are currently in
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes using Vim motions (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes seamlessly using Shift + Vim keys (hold to continuous resize)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Use Vim-style keys while in tmux Copy Mode (Prefix + [)
setw -g mode-keys vi


# =====================================================================
# 3. VISUAL STYLING & STATUS BAR
# =====================================================================

# Refresh status line every 5 seconds
set -g status-interval 5

# Clean Status Bar layout
set -g status-position top
set -g status-style bg=black,fg=white

# Left side of status bar (Session name)
set -g status-left-length 30
set -g status-left "#[fg=green,bold] #S #[fg=white]| "

# Right side of status bar (Date and time)
set -g status-right "#[fg=cyan]%Y-%m-%d #[fg=yellow]%H:%M:%S "

# Customize active and inactive window tabs
setw -g window-status-current-style bg=blue,fg=black,bold
setw -g window-status-current-format " #I:#W* "
setw -g window-status-style bg=black,fg=gray
setw -g window-status-format " #I:#W "


